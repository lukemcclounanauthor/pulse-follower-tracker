
name: Update Pulse follower tracker

'on':
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  update:
    name: Generate live follower tracker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install Pillow==11.3.0

      - name: Update Pulse follower tracker
        env:
          APISH_KEY: ${{ secrets.APISH_KEY }}
        run: python update.py

      - name: Commit updated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/progress.png docs/status.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Pulse follower progress"
            git push
          else
            echo "No changes to follower tracker."
          fi
